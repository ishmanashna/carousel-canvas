[package]
name = "vision"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake2 = "0.10"
core = { path = "../core" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "directml", "load-dynamic", "ndarray", "tls-native"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
